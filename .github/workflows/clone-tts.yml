name: clone-tts (one-off)

on:
  push:
    branches: ["arena/e599117f-audio-cloning"]
    paths: ["clone-task/GO"]
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    shell: bash

jobs:
  synth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: arena/e599117f-audio-cloning
          fetch-depth: 0

      - name: git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: phase ref (fetch reference, cut 5s, signal REF_DOWNLOADED)
        run: |
          export CLONE_TMP="${RUNNER_TEMP:-/tmp}/clone-task"
          mkdir -p "$CLONE_TMP"
          bash clone-task/run.sh ref 2>&1 | tee -a "$CLONE_TMP/phase.log"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: phase deps
        run: |
          export CLONE_TMP="${RUNNER_TEMP:-/tmp}/clone-task"
          mkdir -p "$CLONE_TMP"
          bash clone-task/run.sh deps 2>&1 | tee -a "$CLONE_TMP/phase.log"

      - name: phase model (download ONNX package, verify hashes)
        run: |
          export CLONE_TMP="${RUNNER_TEMP:-/tmp}/clone-task"
          mkdir -p "$CLONE_TMP"
          bash clone-task/run.sh model 2>&1 | tee -a "$CLONE_TMP/phase.log"

      - name: phase synth (smoke + full text, encrypt, commit result)
        run: |
          export CLONE_TMP="${RUNNER_TEMP:-/tmp}/clone-task"
          mkdir -p "$CLONE_TMP"
          bash clone-task/run.sh synth 2>&1 | tee -a "$CLONE_TMP/phase.log"

      - name: publish diagnostics (always)
        if: always()
        run: |
          export CLONE_TMP="${RUNNER_TEMP:-/tmp}/clone-task"
          mkdir -p "$CLONE_TMP"
          bash clone-task/run.sh diag
